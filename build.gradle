plugins {
    id 'base'               // 添加这一行
}
allprojects {
    version = project.mod_version
    group = project.maven_group
}

clean {
    delete rootProject.layout.buildDirectory.dir('libs')
}
subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }
}
// 只收集可安装的模组本体，即两个 loader 的 jar：
//   - common 只是共享中间产物，没有 fabric.mod.json / neoforge.mods.toml，跳过；
//   - 每个模块只取主 jar（archiveClassifier 为空），sources/dev/javadoc 这些带分类器的辅助产物
//     仍然照常构建，只是不往这里复制。
def modJarTasks = subprojects.findAll { it.name in ['fabric', 'neoforge'] }.collectMany { subproject ->
    subproject.tasks.withType(Jar).matching { jar ->
        jar.archiveClassifier.getOrElse('').isEmpty()
    }
}

tasks.register('collectJars', Copy) {
    dependsOn modJarTasks
    from modJarTasks
    // 按版本分目录存放，这样同一次构建的产物聚在一起，也不会被别的版本或 sources jar 混在一起
    into rootProject.layout.buildDirectory.dir("libs/${project.version}")
}

// 让根项目的build任务在完成后执行collectJars
tasks.named('build') {
    finalizedBy collectJars
}